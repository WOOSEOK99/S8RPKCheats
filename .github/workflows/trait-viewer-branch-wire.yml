name: Wire trait viewer branch

on:
  push:
    paths:
      - '.github/workflows/trait-viewer-branch-wire.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/feature/trait-viewer-memory-patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/trait-viewer-memory-patch
          fetch-depth: 0
      - name: Wire trait viewer files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8-sig')
              if new in s:
                  return
              if old not in s:
                  raise SystemExit(f'target not found: {path}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8-sig')

          patch('Internal DX11 Base/Internal DX11 Base.vcxproj',
                '    <ClInclude Include="Cheats\\Officer\\OfficerDetail.h" />\n',
                '    <ClInclude Include="Cheats\\Officer\\OfficerDetail.h" />\n    <ClInclude Include="Cheats\\Officer\\TraitViewer.h" />\n')
          patch('Internal DX11 Base/Internal DX11 Base.vcxproj',
                '    <ClCompile Include="Cheats\\Officer\\OfficerDetail.cpp" />\n',
                '    <ClCompile Include="Cheats\\Officer\\OfficerDetail.cpp" />\n    <ClCompile Include="Cheats\\Officer\\TraitViewer.cpp" />\n')

          patch('Internal DX11 Base/MenuSections.cpp',
                '#include "Cheats/Officer/SelectOfficercapture.h"\n',
                '#include "Cheats/Officer/SelectOfficercapture.h"\n#include "Cheats/Officer/TraitViewer.h"\n')
          patch('Internal DX11 Base/MenuSections.cpp',
                '''      if (ImGui::Checkbox(u8"기재 화면 보이기", &DX11Base::bTraitViewer)) {\n        NotifyFeatureToggle(u8"기재 화면 보이기", DX11Base::bTraitViewer);\n        SaveConfig();\n      }\n''',
                '''      if (ImGui::Checkbox(u8"기재 화면 보이기", &DX11Base::bTraitViewer)) {\n        const bool requested = DX11Base::bTraitViewer;\n        if (!DX11Base::SetTraitViewer(requested))\n          DX11Base::bTraitViewer = DX11Base::IsTraitViewerApplied();\n        NotifyFeatureToggle(u8"기재 화면 보이기", DX11Base::bTraitViewer);\n        SaveConfig();\n      }\n''')

          patch('Internal DX11 Base/Config.cpp',
                '#define SaveConfig SaveConfigBase\n',
                '#include "Cheats/Officer/TraitViewer.h"\n\n#define SaveConfig SaveConfigBase\n')
          patch('Internal DX11 Base/Config.cpp',
                '''    // 이전 설정 파일에 키가 없으면 MenuState.cpp의 기본값(true)을 그대로 유지합니다.\n    bool savedTraitViewer = true;\n    if (LoadBoolConfigValue("bTraitViewer", savedTraitViewer)) {\n      bTraitViewer = savedTraitViewer;\n      AddLog(u8"[Config] 기재 화면 보이기 설정 로드: %s", savedTraitViewer ? "ON" : "OFF");\n    }\n''',
                '''    // 이전 설정 파일에 키가 없으면 MenuState.cpp의 기본값(true)을 사용하고 실제 패치도 적용합니다.\n    bool savedTraitViewer = true;\n    if (LoadBoolConfigValue("bTraitViewer", savedTraitViewer))\n      bTraitViewer = savedTraitViewer;\n\n    if (!SetTraitViewer(bTraitViewer))\n      bTraitViewer = IsTraitViewerApplied();\n    AddLog(u8"[Config] 기재 화면 보이기 설정 로드: %s", bTraitViewer ? "ON" : "OFF");\n''')
          PY
      - name: Commit branch wiring
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'Internal DX11 Base/Internal DX11 Base.vcxproj' 'Internal DX11 Base/MenuSections.cpp' 'Internal DX11 Base/Config.cpp'
          git commit -m 'Wire trait viewer memory patch toggle'
          git push origin HEAD:feature/trait-viewer-memory-patch
