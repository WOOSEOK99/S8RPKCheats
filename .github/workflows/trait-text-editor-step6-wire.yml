name: Trait text editor step6 wire

on:
  push:
    paths:
      - '.github/workflows/trait-text-editor-step6-wire.yml'

permissions:
  contents: write

jobs:
  wire:
    if: github.ref == 'refs/heads/feature/trait-text-editor-step6-autoapply'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/trait-text-editor-step6-autoapply
          fetch-depth: 0
      - name: Apply Step 6 patch
        run: python tools/trait_text_editor_step6_patch.py
      - name: Commit Step 6
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'Internal DX11 Base/Cheats/Officer/TraitTextEditorWindow.h' \
                  'Internal DX11 Base/Cheats/Officer/TraitTextEditorWindow.cpp' \
                  'Internal DX11 Base/MenuSections.cpp'
          git commit -m 'Trait text editor Step 6: add delayed auto-apply'
          git push origin HEAD:feature/trait-text-editor-step6-autoapply
