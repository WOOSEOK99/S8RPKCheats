name: One-off social layout fix

on:
  push:
    branches:
      - fix/social-cheat-coexistence

permissions:
  contents: write

jobs:
  fix-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/social-cheat-coexistence
          fetch-depth: 0
      - run: python3 .github/scripts/fix_social_layout.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Internal DX11 Base/MenuSections.cpp'
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Fix social checkbox layout after hiding unavailable toggle'
          git push origin HEAD:fix/social-cheat-coexistence
