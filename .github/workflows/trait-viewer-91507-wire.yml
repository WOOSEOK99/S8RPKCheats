name: Wire trait viewer 91507

on:
  push:
    paths:
      - '.github/workflows/trait-viewer-91507-wire.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/feature/trait-viewer-memory-patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/trait-viewer-memory-patch
          fetch-depth: 0
      - name: Fix and wire 91507
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path)
              s=p.read_text(encoding='utf-8-sig')
              if new in s:
                  return
              if old not in s:
                  raise SystemExit(f'target not found: {path}: {old[:80]}')
              p.write_text(s.replace(old,new,1),encoding='utf-8-sig')

          # Correct the three rel32 displacement offsets in qtInit.
          p=Path('Internal DX11 Base/Cheats/Officer/TraitViewerBattleMap.cpp')
          s=p.read_text(encoding='utf-8-sig')
          s=s.replace('PatchRel32(init, 0x23, g_cave + 0x2000, g_cave + 0x108)',
                      'PatchRel32(init, 0x24, g_cave + 0x2000, g_cave + 0x108)')
          s=s.replace('PatchRel32(init, 0x2E, g_cave + 0x2000, g_cave + 0x000)',
                      'PatchRel32(init, 0x2F, g_cave + 0x2000, g_cave + 0x000)')
          s=s.replace('PatchRel32(init, 0x3A, g_cave + 0x2000, base + 0x1DD6E7C)',
                      'PatchRel32(init, 0x3B, g_cave + 0x2000, base + 0x1DD6E7C)')
          p.write_text(s,encoding='utf-8-sig')

          replace_once('Internal DX11 Base/Internal DX11 Base.vcxproj',
              '    <ClInclude Include="Cheats\\Officer\\TraitViewer.h" />\n',
              '    <ClInclude Include="Cheats\\Officer\\TraitViewer.h" />\n    <ClInclude Include="Cheats\\Officer\\TraitViewerBattleMap.h" />\n    <ClInclude Include="Cheats\\Officer\\TraitViewerFeature.h" />\n')
          replace_once('Internal DX11 Base/Internal DX11 Base.vcxproj',
              '    <ClCompile Include="Cheats\\Officer\\TraitViewer.cpp" />\n',
              '    <ClCompile Include="Cheats\\Officer\\TraitViewer.cpp" />\n    <ClCompile Include="Cheats\\Officer\\TraitViewerBattleMap.cpp" />\n    <ClCompile Include="Cheats\\Officer\\TraitViewerFeature.cpp" />\n')

          replace_once('Internal DX11 Base/MenuSections.cpp',
              '#include "Cheats/Officer/TraitViewer.h"\n',
              '#include "Cheats/Officer/TraitViewer.h"\n#include "Cheats/Officer/TraitViewerFeature.h"\n')
          replace_once('Internal DX11 Base/MenuSections.cpp',
              '''        if (!DX11Base::SetTraitViewer(requested))\n          DX11Base::bTraitViewer = DX11Base::IsTraitViewerApplied();\n''',
              '''        if (!DX11Base::SetTraitViewerFeature(requested))\n          DX11Base::bTraitViewer = DX11Base::IsTraitViewerFeatureApplied();\n''')

          replace_once('Internal DX11 Base/Config.cpp',
              '#include "Cheats/Officer/TraitViewer.h"\n',
              '#include "Cheats/Officer/TraitViewer.h"\n#include "Cheats/Officer/TraitViewerFeature.h"\n')
          replace_once('Internal DX11 Base/Config.cpp',
              '''    if (!SetTraitViewer(bTraitViewer))\n      bTraitViewer = IsTraitViewerApplied();\n''',
              '''    if (!SetTraitViewerFeature(bTraitViewer))\n      bTraitViewer = IsTraitViewerFeatureApplied();\n''')
          PY
      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'Internal DX11 Base/Cheats/Officer/TraitViewerBattleMap.cpp' 'Internal DX11 Base/Internal DX11 Base.vcxproj' 'Internal DX11 Base/MenuSections.cpp' 'Internal DX11 Base/Config.cpp'
          git commit -m 'Wire trait viewer battle-map patch'
          git push origin HEAD:feature/trait-viewer-memory-patch
