name: Trait viewer step6 wire

on:
  push:
    paths:
      - '.github/workflows/trait-viewer-step6-wire.yml'

permissions:
  contents: write

jobs:
  wire:
    if: github.ref == 'refs/heads/feature/trait-viewer-step6-battle-prep'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/trait-viewer-step6-battle-prep
          fetch-depth: 0
      - name: Write Step 6 source files
        shell: bash
        run: |
          CPP_GZ_B64=''
          H_GZ_B64='H4sICH4eq2oCA1RyYWl0Vmlld2VyQmF0dGxlUHJlcC5oAFMuKEpMz01UyM9LTuXiykvMTS0uSExOVXCJMDR0SixOVajmSsrPz1EITi0JKUrMLAnLTC1PLXJKLCnJSQ0oSi3QAMum5iUm5aRqWkPUehZjVepYUJCTmZqiAVRWq6Cvr4BpGRcASN6heI4AAAA='
          mkdir -p 'Internal DX11 Base/Cheats/Officer'
          printf '%s' "$CPP_GZ_B64" | base64 -d | gzip -d > 'Internal DX11 Base/Cheats/Officer/TraitViewerBattlePrep.cpp'
          printf '%s' "$H_GZ_B64" | base64 -d | gzip -d > 'Internal DX11 Base/Cheats/Officer/TraitViewerBattlePrep.h'
      - name: Register Step 6 files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Internal DX11 Base/Internal DX11 Base.vcxproj')
          s = p.read_text(encoding='utf-8-sig')
          if 'Cheats\\Officer\\TraitViewerBattlePrep.h' not in s:
              s = s.replace('    <ClInclude Include="Cheats\\Officer\\TraitViewerBattleInfo.h" />\n',
                            '    <ClInclude Include="Cheats\\Officer\\TraitViewerBattleInfo.h" />\n    <ClInclude Include="Cheats\\Officer\\TraitViewerBattlePrep.h" />\n', 1)
          if 'Cheats\\Officer\\TraitViewerBattlePrep.cpp' not in s:
              s = s.replace('    <ClCompile Include="Cheats\\Officer\\TraitViewerBattleInfo.cpp">\n      <PreprocessorDefinitions>NOMINMAX;%(PreprocessorDefinitions)</PreprocessorDefinitions>\n    </ClCompile>\n',
                            '    <ClCompile Include="Cheats\\Officer\\TraitViewerBattleInfo.cpp">\n      <PreprocessorDefinitions>NOMINMAX;%(PreprocessorDefinitions)</PreprocessorDefinitions>\n    </ClCompile>\n    <ClCompile Include="Cheats\\Officer\\TraitViewerBattlePrep.cpp" />\n', 1)
          p.write_text(s, encoding='utf-8-sig')
          PY
      - name: Commit Step 6
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'Internal DX11 Base/Cheats/Officer/TraitViewerBattlePrep.cpp' \
                  'Internal DX11 Base/Cheats/Officer/TraitViewerBattlePrep.h' \
                  'Internal DX11 Base/Internal DX11 Base.vcxproj'
          git commit -m 'Step 6: add battle preparation third trait patch'
          git push origin HEAD:feature/trait-viewer-step6-battle-prep
