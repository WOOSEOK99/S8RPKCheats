name: Trait viewer step7 wire

on:
  push:
    paths:
      - '.github/workflows/trait-viewer-step7-wire.yml'

permissions:
  contents: write

jobs:
  wire:
    if: github.ref == 'refs/heads/feature/trait-viewer-step7-integration-toggle'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/trait-viewer-step7-integration-toggle
          fetch-depth: 0
      - name: Apply Step 7 wiring
        run: python tools/step7_patch.py
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'Internal DX11 Base/MenuSections.cpp' 'Internal DX11 Base/Config.cpp' 'Internal DX11 Base/Internal DX11 Base.vcxproj'
          git commit -m 'Step 7: wire trait viewer toggle and config'
          git push origin HEAD:feature/trait-viewer-step7-integration-toggle
