name: Trait viewer step2 wire

on:
  push:
    paths:
      - '.github/workflows/trait-viewer-step2-wire.yml'

permissions:
  contents: write

jobs:
  wire:
    if: github.ref == 'refs/heads/feature/trait-viewer-step2-roster'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/trait-viewer-step2-roster
          fetch-depth: 0
      - name: Register Step 2 files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Internal DX11 Base/Internal DX11 Base.vcxproj')
          s = p.read_text(encoding='utf-8-sig')
          if 'Cheats\\Officer\\TraitViewerRoster.h' not in s:
              s = s.replace('    <ClInclude Include="Cheats\\Officer\\TraitViewerWidths.h" />\n',
                            '    <ClInclude Include="Cheats\\Officer\\TraitViewerWidths.h" />\n    <ClInclude Include="Cheats\\Officer\\TraitViewerRoster.h" />\n', 1)
          if 'Cheats\\Officer\\TraitViewerRoster.cpp' not in s:
              s = s.replace('    <ClCompile Include="Cheats\\Officer\\TraitViewerWidths.cpp" />\n',
                            '    <ClCompile Include="Cheats\\Officer\\TraitViewerWidths.cpp" />\n    <ClCompile Include="Cheats\\Officer\\TraitViewerRoster.cpp" />\n', 1)
          p.write_text(s, encoding='utf-8-sig')
          PY
      - name: Commit project registration
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'Internal DX11 Base/Internal DX11 Base.vcxproj'
          git commit -m 'Step 2: register trait viewer roster patches'
          git push origin HEAD:feature/trait-viewer-step2-roster
