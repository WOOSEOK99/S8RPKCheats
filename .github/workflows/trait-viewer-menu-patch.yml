name: Trait viewer cleanup

on:
  push:
    paths:
      - '.github/workflows/trait-viewer-menu-patch.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore unrelated MenuSections line
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('Internal DX11 Base/MenuSections.cpp')
          text = path.read_text(encoding='utf-8-sig')
          bad = '        DrawStatRow(u8"공적", &v_Merit, 0x100, 2, p1, gameBase, scale);'
          good = '        DrawStatRow(u8"공적", 0x100, 2, &v_Merit, p1, gameBase, scale);'
          if bad in text:
              text = text.replace(bad, good, 1)
              path.write_text(text, encoding='utf-8-sig')
          elif good not in text:
              raise SystemExit('Expected DrawStatRow line not found')
          PY
      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet -- 'Internal DX11 Base/MenuSections.cpp'; then
            echo "No cleanup needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'Internal DX11 Base/MenuSections.cpp'
          git commit -m 'Restore unrelated MenuSections change'
          git push origin HEAD:main
