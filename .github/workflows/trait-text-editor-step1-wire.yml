name: Trait text editor step1 wire

on:
  push:
    paths:
      - '.github/workflows/trait-text-editor-step1-wire.yml'

permissions:
  contents: write

jobs:
  wire:
    if: github.ref == 'refs/heads/feature/trait-text-editor-step1-storage'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/trait-text-editor-step1-storage
          fetch-depth: 0
      - name: Write Step 1 source files
        shell: bash
        run: |
          mkdir -p 'Internal DX11 Base/Cheats/Officer'
          printf '%s' '' | base64 -d | gzip -d > 'Internal DX11 Base/Cheats/Officer/TraitTextEditorData.h'
          printf '%s' '' | base64 -d | gzip -d > 'Internal DX11 Base/Cheats/Officer/TraitTextEditorData.cpp'
      - name: Register Step 1 files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Internal DX11 Base/Internal DX11 Base.vcxproj')
          s = p.read_text(encoding='utf-8-sig')
          if 'Cheats\\Officer\\TraitTextEditorData.h' not in s:
              anchor = '    <ClInclude Include="Cheats\\Officer\\TraitViewerWidths.h" />\n'
              if anchor not in s:
                  raise SystemExit('header anchor missing')
              s = s.replace(anchor, anchor + '    <ClInclude Include="Cheats\\Officer\\TraitTextEditorData.h" />\n', 1)
          if 'Cheats\\Officer\\TraitTextEditorData.cpp' not in s:
              anchor = '    <ClCompile Include="Cheats\\Officer\\TraitViewerWidths.cpp" />\n'
              if anchor not in s:
                  raise SystemExit('cpp anchor missing')
              s = s.replace(anchor, anchor + '    <ClCompile Include="Cheats\\Officer\\TraitTextEditorData.cpp" />\n', 1)
          p.write_text(s, encoding='utf-8-sig')
          PY
      - name: Commit Step 1
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'Internal DX11 Base/Cheats/Officer/TraitTextEditorData.h' \
                  'Internal DX11 Base/Cheats/Officer/TraitTextEditorData.cpp' \
                  'Internal DX11 Base/Internal DX11 Base.vcxproj'
          git commit -m 'Trait text editor Step 1: add data and storage layer'
          git push origin HEAD:feature/trait-text-editor-step1-storage
