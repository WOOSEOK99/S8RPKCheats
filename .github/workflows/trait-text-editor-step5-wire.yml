name: Trait text editor step5 wire

on:
  push:
    paths:
      - '.github/workflows/trait-text-editor-step5-wire.yml'

permissions:
  contents: write

jobs:
  wire:
    if: github.ref == 'refs/heads/feature/trait-text-editor-step5-ui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/trait-text-editor-step5-ui
          fetch-depth: 0
      - name: Apply Step 5 wiring
        run: python tools/trait_text_editor_step5_patch.py
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'Internal DX11 Base/MenuSections.cpp' 'Internal DX11 Base/Internal DX11 Base.vcxproj'
          git commit -m 'Trait text editor Step 5: wire ImGui editor'
          git push origin HEAD:feature/trait-text-editor-step5-ui
